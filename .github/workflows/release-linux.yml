# Builds the Linux packages for a version tag and uploads them to that tag's GitHub release.
# Manual dispatch only. The tag is created by tag-version on push to main. Pick it in
# "Use workflow from" (the Tags tab) when running the workflow: that tag is what gets built.
name: release-linux

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Check the tag
        id: check
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::run this workflow from a version tag: pick it in 'Use workflow from' (now: $REF_TYPE '$TAG')."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a version tag (vX.Y.Z)."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG does not exist. tag-version creates it on push to main."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
            echo "::error::tag $TAG is not in the history of main."
            exit 1
          fi
          version=$(tool/version.sh get)
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error::tag $TAG does not match apps/bodega/pubspec.yaml (version $version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    # ubuntu-24.04 on purpose: its glibc (2.39) is the oldest one the packages should need.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: system packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            dpkg-dev zstd xz-utils squashfs-tools
      # The project needs Dart ^3.13, which ships with Flutter 3.47.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
      - name: package
        run: ./tool/package_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: dist/*
          if-no-files-found: error

  # The pacman package wraps the .tar.gz that build made, so Arch's newer glibc does not matter.
  arch:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: archlinux:base-devel
    steps:
      - name: git
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: linux-installers
          path: dist/
      - name: package
        run: |
          set -euo pipefail
          # makepkg refuses to run as root.
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c 'cd "$GITHUB_WORKSPACE" && packaging/arch/build_arch.sh dist/Bodega-*-linux-x86_64.tar.gz arch-dist'
      - uses: actions/upload-artifact@v4
        with:
          name: arch-installers
          path: arch-dist/*.pkg.tar.zst
          if-no-files-found: error

  release:
    needs: [build, arch]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      # Only so that gh knows the repository.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-installers"
          merge-multiple: true
          path: dist/
      - name: Create the release if missing and upload the packages
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Bodega ${TAG#v}" --generate-notes
          gh release upload "$TAG" dist/* --clobber
