# Builds the Linux packages for a version tag and uploads them to that tag's GitHub release.
# Manual dispatch only. The tag is created by tag-version on push to main. Pick it in
# "Use workflow from" (the Tags tab) when running the workflow: that tag is what gets built.
# The account is on GitHub Free (included compute and 500 MB of artifact storage): the smoke tests are
# off unless asked for, and the artifacts live one day.
name: release-linux

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: "install each package in a clean container and run its CLI before publishing (about 20 min of Linux runner time)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Check the tag
        id: check
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::run this workflow from a version tag: pick it in 'Use workflow from' (now: $REF_TYPE '$TAG')."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a version tag (vX.Y.Z)."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG does not exist. tag-version creates it on push to main."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
            echo "::error::tag $TAG is not in the history of main."
            exit 1
          fi
          version=$(tool/version.sh get)
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error::tag $TAG does not match apps/bodega/pubspec.yaml (version $version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    # ubuntu-24.04 on purpose: its glibc (2.39) is the oldest one the packages should need.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: system packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            dpkg-dev zstd xz-utils squashfs-tools
      # The project needs Dart ^3.13, which ships with Flutter 3.47.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
      - name: package
        run: ./tool/package_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          retention-days: 1
          path: dist/*
          if-no-files-found: error

  # The pacman package wraps the .tar.gz that build made, so Arch's newer glibc does not matter.
  arch:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: archlinux:base-devel
    steps:
      - name: git
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: linux-installers
          path: dist/
      - name: package
        run: |
          set -euo pipefail
          # makepkg refuses to run as root.
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c 'cd "$GITHUB_WORKSPACE" && packaging/arch/build_arch.sh dist/Bodega-*-linux-x86_64.tar.gz arch-dist'
      - uses: actions/upload-artifact@v4
        with:
          name: arch-installers
          retention-days: 1
          path: arch-dist/*.pkg.tar.zst
          if-no-files-found: error

  # Installs each package in a clean container and runs its CLI; a package that does not start blocks the release.
  smoke:
    needs: [build, arch]
    if: ${{ inputs.smoke }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kind: [deb, arch, appimage]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-installers"
          merge-multiple: true
          path: dist/
      - name: ${{ matrix.kind }}
        run: ./tool/smoke_linux.sh ${{ matrix.kind }} dist

  release:
    needs: [build, arch, smoke]
    # smoke is skipped unless asked for, and a skipped need would skip this job too.
    if: ${{ always() && needs.build.result == 'success' && needs.arch.result == 'success' && needs.smoke.result != 'failure' && needs.smoke.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      # Only so that gh knows the repository.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-installers"
          merge-multiple: true
          path: dist/
      - name: Checksums
        run: |
          set -euo pipefail
          # Written outside dist/ first, so the file does not list itself.
          (cd dist && sha256sum -- * > ../SHA256SUMS-linux)
          mv SHA256SUMS-linux dist/
          cat dist/SHA256SUMS-linux
      # Provenance is on top of the checksums: if the plan or the repository does not allow it, the release goes out with the checksums only.
      - name: Attest the packages
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - name: Create the release if missing and upload the packages
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Bodega ${TAG#v}" --generate-notes
          gh release upload "$TAG" dist/* --clobber
      # The app looks for updates in this public repository, which has the releases and no code (design §6).
      - name: Publish to bodega-releases
        env:
          PUBLIC_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          PUBLIC_REPO: dany021115/bodega-releases
        run: |
          set -euo pipefail
          if [ -z "$PUBLIC_TOKEN" ]; then
            echo "::warning::no RELEASES_TOKEN secret: $TAG was not published to $PUBLIC_REPO."
            exit 0
          fi
          # The same notes as the private release, read with this repository's token.
          gh release view "$TAG" --json body -q .body > notes.md
          # The engine is Wine (LGPL): its recipe and patches go with the binaries.
          tar -czf wine-src.tar.gz wine
          export GH_TOKEN="$PUBLIC_TOKEN"
          # Both release workflows may get here at once: whichever loses the race finds it made.
          gh release view "$TAG" -R "$PUBLIC_REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$PUBLIC_REPO" --title "Bodega ${TAG#v}" --notes-file notes.md \
            || gh release view "$TAG" -R "$PUBLIC_REPO" >/dev/null
          gh release upload "$TAG" -R "$PUBLIC_REPO" dist/* wine-src.tar.gz --clobber
