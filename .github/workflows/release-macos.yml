# Builds the macOS installer (.dmg) for a version tag and uploads it to that tag's GitHub release.
# Manual dispatch only. The tag is created by tag-version on push to main. Pick it in
# "Use workflow from" (the Tags tab) when running the workflow: that tag is what gets built.
# The engine and host libraries come from this repository's releases,
# or are built first when build_engine / build_hostlibs are on.
name: release-macos

on:
  workflow_dispatch:
    inputs:
      engine_tag:
        description: "engine-* release to package (empty = the most recent engine-* release of this repository)"
        type: string
        required: false
        default: ""
      hostlibs_tag:
        description: "hostlibs-* release to package (empty = the most recent hostlibs-* release of this repository)"
        type: string
        required: false
        default: ""
      build_engine:
        description: "builds Wine from the tag this workflow runs on and publishes it first; hours of macOS runner time"
        type: boolean
        default: false
      build_hostlibs:
        description: "builds the host libraries from the tag this workflow runs on and publishes them first; minutes of macOS runner time"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Check the tag
        id: check
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::run this workflow from a version tag: pick it in 'Use workflow from' (now: $REF_TYPE '$TAG')."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a version tag (vX.Y.Z)."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG does not exist. tag-version creates it on push to main."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
            echo "::error::tag $TAG is not in the history of main."
            exit 1
          fi
          version=$(tool/version.sh get)
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error::tag $TAG does not match apps/bodega/pubspec.yaml (version $version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  engine:
    needs: check
    if: ${{ inputs.build_engine }}
    uses: ./.github/workflows/build.yml
    with:
      publish_release: true
      ref_note: release
    permissions:
      contents: write

  hostlibs:
    needs: check
    if: ${{ inputs.build_hostlibs }}
    uses: ./.github/workflows/build-hostlibs.yml
    with:
      publish_release: true
      ref_note: release
    permissions:
      contents: write

  package:
    needs: [check, engine, hostlibs]
    # Runs even when engine or hostlibs were skipped, but not when one of them failed or was cancelled.
    if: ${{ always() && needs.check.result == 'success' && needs.engine.result != 'failure' && needs.hostlibs.result != 'failure' && needs.engine.result != 'cancelled' && needs.hostlibs.result != 'cancelled' }}
    # macos-15 is the arm64 runner.
    runs-on: macos-15
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      ENGINE_TAG: ${{ inputs.engine_tag }}
      HOSTLIBS_TAG: ${{ inputs.hostlibs_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install Rosetta
        run: softwareupdate --install-rosetta --agree-to-license || true
      # The project needs Dart ^3.13, which ships with Flutter 3.47.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
      - name: package
        run: |
          set -euo pipefail
          # bash 3.2 (the runner's) fails on "${args[@]}" when the array is empty under set -u.
          args=()
          if [ -n "$ENGINE_TAG" ]; then args+=(--engine-tag "$ENGINE_TAG"); fi
          if [ -n "$HOSTLIBS_TAG" ]; then args+=(--hostlibs-tag "$HOSTLIBS_TAG"); fi
          ./tool/package_macos.sh ${args[@]+"${args[@]}"}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          retention-days: 1
          path: dist/*
          if-no-files-found: error

  release:
    needs: [check, package]
    # The implicit success() also looks at engine and hostlibs, which are skipped when they are not built,
    # so without this the release job would be skipped too.
    if: ${{ always() && needs.check.result == 'success' && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      # Only so that gh knows the repository.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: dist/
      - name: Checksums
        run: |
          set -euo pipefail
          # Written outside dist/ first, so the file does not list itself.
          (cd dist && sha256sum -- * > ../SHA256SUMS-macos)
          mv SHA256SUMS-macos dist/
          cat dist/SHA256SUMS-macos
      # Provenance is on top of the checksums: if the plan or the repository does not allow it, the release goes out with the checksums only.
      - name: Attest the installer
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - name: Create the release if missing and upload the installer
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Bodega ${TAG#v}" --generate-notes
          gh release upload "$TAG" dist/* --clobber
      # The app looks for updates in this public repository, which has the releases and no code (design §6).
      - name: Publish to bodega-releases
        env:
          PUBLIC_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          PUBLIC_REPO: dany021115/bodega-releases
        run: |
          set -euo pipefail
          if [ -z "$PUBLIC_TOKEN" ]; then
            echo "::warning::no RELEASES_TOKEN secret: $TAG was not published to $PUBLIC_REPO."
            exit 0
          fi
          # The same notes as the private release, read with this repository's token.
          gh release view "$TAG" --json body -q .body > notes.md
          # The engine is Wine (LGPL): its recipe and patches go with the binaries.
          tar -czf wine-src.tar.gz wine
          export GH_TOKEN="$PUBLIC_TOKEN"
          # Both release workflows may get here at once: whichever loses the race finds it made.
          gh release view "$TAG" -R "$PUBLIC_REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$PUBLIC_REPO" --title "Bodega ${TAG#v}" --notes-file notes.md \
            || gh release view "$TAG" -R "$PUBLIC_REPO" >/dev/null
          gh release upload "$TAG" -R "$PUBLIC_REPO" dist/* wine-src.tar.gz --clobber
