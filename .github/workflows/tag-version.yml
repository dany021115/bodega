# The only place where version tags are created: on push to main, if the pubspec version has no tag yet.
name: tag-version

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tag-version
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the version tag if it is missing
        run: |
          ver=$(tool/version.sh get)
          tag="v$ver"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Bodega $ver" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
