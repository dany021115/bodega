include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated code: not hand-written, shouldn't be linted.
    - "**/*.freezed.dart"
    - "**/*.g.dart"
    - "**/*.config.dart"
    - "**/generated_plugin_registrant.dart"
    - "lib/resources/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    prefer_const_constructors: true
    prefer_final_locals: true
